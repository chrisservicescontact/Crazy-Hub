<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title> Crazy Games Hub</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: #eee;
    margin: 0; padding: 0;
  }
  header {
    background: #222;
    padding: 1rem;
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
  }
  #gameList {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 1rem;
    justify-content: center;
  }
  .gameButton {
    background: #333;
    border: none;
    border-radius: 8px;
    padding: 1rem 1.5rem;
    color: #eee;
    font-size: 1.2rem;
    cursor: pointer;
    transition: background 0.3s;
    min-width: 200px;
  }
  .gameButton:hover {
    background: #555;
  }
  #gameContainer {
    padding: 1rem;
    max-width: 800px;
    margin: 0 auto;
    background: #222;
    border-radius: 10px;
    min-height: 400px;
  }
  #backBtn {
    margin: 1rem;
    cursor: pointer;
    color: #00aced;
    text-decoration: underline;
  }
  .hidden {
    display: none;
  }
  input, button {
    font-size: 1rem;
  }
</style>
</head>
<body>
<div id="gameContainer" class="hidden">
  <div id="backBtn">Crazy Games Main HuB</div>
  <div id="gameContent"></div>
</div>
<header>Crazy Games Main Hub</header>

<div id="gameList">
  <button class="gameButton" data-game="pizza">{PlaceHolder1}</button>
  <button class="gameButton" data-game="math">{PlaceHolder2}</button>
  <button class="gameButton" data-game="reaction">{PlaceHolder3}</button>
  <!-- Add more games here -->
</div>
<div id="gameContainer" class="hidden">
  <div id="backBtn">Click here to go to the main hub.</div>
  <div id="gameContent"></div>
</div>
<script>
  const gameList = document.getElementById('gameList');
  const gameContainer = document.getElementById('gameContainer');
  const gameContent = document.getElementById('gameContent');
  const backBtn = document.getElementById('backBtn');

  // Switch to game view
  gameList.addEventListener('click', e => {
    if (e.target.matches('button.gameButton')) {
      const game = e.target.dataset.game;
      loadGame(game);
    }
  });

  backBtn.addEventListener('click', () => {
    gameContainer.classList.add('hidden');
    gameContent.innerHTML = '';
    gameList.style.display = 'flex';
  });

  function loadGame(game) {
    gameList.style.display = 'none';
    gameContainer.classList.remove('hidden');
    gameContent.innerHTML = '';

    if (game === '{PlaceHolder1}') {
      loadPizzaGame();
    } else if (game === '{PlaceHolder2}') {
      loadMathGame();
    } else if (game === '{PlaceHolder3}') {
      loadReactionGame();
    }
  }
  </script>
  <script> 
  // === Papa's Pizza Lite (Simplified) ===
  function loadPizzaGame() {
    gameContent.innerHTML = `
      <h2>Papa's Pizza Lite</h2>
      <p>Make a pizza! Choose toppings and bake it.</p>
      <label><input type="checkbox" id="pepperoni"> Pepperoni</label><br>
      <label><input type="checkbox" id="mushrooms"> Mushrooms</label><br>
      <label><input type="checkbox" id="onions"> Onions</label><br><br>
      <button id="bakeBtn">Bake Pizza</button>
      <div id="pizzaResult" style="margin-top:1rem;"></div>
    `;

    const bakeBtn = document.getElementById('bakeBtn');
    const pizzaResult = document.getElementById('pizzaResult');

    bakeBtn.onclick = () => {
      let toppings = [];
      if(document.getElementById('pepperoni').checked) toppings.push('Pepperoni');
      if(document.getElementById('mushrooms').checked) toppings.push('Mushrooms');
      if(document.getElementById('onions').checked) toppings.push('Onions');
      if(toppings.length === 0) pizzaResult.textContent = "You baked a plain cheese pizza!";
      else pizzaResult.textContent = `You baked a pizza with ${toppings.join(', ')}. Delicious! 🍕`;
    };
  }

  // === Quick Math Challenge ===
  function loadMathGame() {
    gameContent.innerHTML = `
      <h2>Quick Math Challenge</h2>
      <p>Solve the math problem:</p>
      <div id="mathProblem" style="font-size: 1.5rem; margin: 1rem 0;"></div>
      <input type="number" id="answer" />
      <button id="submitAnswer">Submit</button>
      <div id="feedback" style="margin-top: 1rem;"></div>
      <button id="newProblem" style="margin-top: 1rem;">New Problem</button>
    `;

    const mathProblem = document.getElementById('mathProblem');
    const answerInput = document.getElementById('answer');
    const feedback = document.getElementById('feedback');
    const submitBtn = document.getElementById('submitAnswer');
    const newProblemBtn = document.getElementById('newProblem');

    let correctAnswer;

    function generateProblem() {
      const a = Math.floor(Math.random() * 20) + 1;
      const b = Math.floor(Math.random() * 20) + 1;
      const ops = ['+', '-', '*'];
      const op = ops[Math.floor(Math.random() * ops.length)];

      mathProblem.textContent = `${a} ${op} ${b} = ?`;
      switch(op) {
        case '+': correctAnswer = a + b; break;
        case '-': correctAnswer = a - b; break;
        case '*': correctAnswer = a * b; break;
      }
      feedback.textContent = '';
      answerInput.value = '';
      answerInput.focus();
    }

    submitBtn.onclick = () => {
      const userAnswer = Number(answerInput.value);
      if (userAnswer === correctAnswer) {
        feedback.textContent = "Correct! 🎉";
      } else {
        feedback.textContent = `Wrong! The answer was ${correctAnswer}. Try again.`;
      }
    };

    newProblemBtn.onclick = generateProblem;

    generateProblem();
  }

  // === Reaction Test Game ===
  function loadReactionGame() {
    gameContent.innerHTML = `
      <h2>Reaction Test</h2>
      <p>Wait for the box to turn green, then click it as fast as you can!</p>
      <div id="reactionBox" style="width:200px; height:200px; background:#d33; margin:1rem auto; cursor:pointer;"></div>
      <div id="reactionTime" style="font-size:1.5rem; text-align:center;"></div>
      <button id="startBtn">Start Test</button>
    `;

    const reactionBox = document.getElementById('reactionBox');
    const reactionTime = document.getElementById('reactionTime');
    const startBtn = document.getElementById('startBtn');

    let startTime, timeout;

    function startTest() {
      reactionBox.style.background = '#d33';
      reactionTime.textContent = '';
      startBtn.disabled = true;

      const waitTime = Math.floor(Math.random() * 3000) + 2000;

      timeout = setTimeout(() => {
        reactionBox.style.background = '#3d3';
        startTime = performance.now();
      }, waitTime);
    }

    reactionBox.onclick = () => {
      if (reactionBox.style.background === 'rgb(61, 211, 61)') {
        const endTime = performance.now();
        const diff = endTime - startTime;
        reactionTime.textContent = `Your reaction time: ${diff.toFixed(0)} ms`;
        reactionBox.style.background = '#555';
        startBtn.disabled = false;
        clearTimeout(timeout);
      } else {
        reactionTime.textContent = "Too soon! Wait for green.";
        clearTimeout(timeout);
        startBtn.disabled = false;
      }
    };

    startBtn.onclick = startTest;
  }
</script>
</body>
</html>
